<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Tegrity-Soft — Sistema de Ingeniería Web</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #070a10;
      }
      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="tegrity-hero"
      data-start="0"
      data-duration="8"
      data-width="1280"
      data-height="720"
    >
      <div
        id="stage"
        class="clip"
        data-composition-id="stage"
        data-composition-src="compositions/stage.html"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1280"
        data-height="720"
      ></div>
    </div>
    <script>
      window.__timelines["tegrity-hero"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
